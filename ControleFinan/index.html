<!DOCTYPE html>
<html lang="en">
<head>

<body class="body">

<h1>Minhas Finanças</h1>
<div class="cards">
    <h3>Mês</h3>
    <select id="mesSelecionado">
        <option value="Janeiro">Janeiro</option>
        <option value="Fevereiro">Fevereiro</option>
        <option value="Março">Março</option>
        <option value="Abril">Abril</option>
        <option value="Maio">Maio</option>
        <option value="Junho">Junho</option>
        <option value="Julho">Julho</option>
        <option value="Agosto">Agosto</option>
        <option value="Setembro">Setembro</option>
        <option value="Outubro">Outubro</option>
        <option value="Novembro">Novembro</option>
        <option value="Dezembro">Dezembro</option>
    </select>
</div>


<br>

<div class="cards">

    <h3>Renda</h3>
    <input type="number" id="renda" placeholder="Digite sua renda ">

</div>

<br>


<div class="cards">

    <h3>Despesas Fixas</h3>
    <input type="number" id="DespesasFixas" placeholder="Digite aqui ">


</div>

<br>

<div class="cards">

    <h3>Despesas Variáveis</h3>
    <input type="number" id="DespesasVariaveis" placeholder="Digite aqui ">


</div>

<br>
<button id="btnCalcular">Calcular Saldo</button>
<br>
<br>
<div class="cards">
